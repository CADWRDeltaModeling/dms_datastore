# Initialization (backfill) recipe: legacy SCHISM boundary FLOW inputs.
#
# One-time ingestion of the legacy simulation boundary flows in
# schism_legacy_bc into the `processed` repo. These are regular 15-min series.
# Run once with `skip: False`, confirm the staged/reconciled result, then flip
# each entry to `skip: True` to leave it as a self-documenting record.
#
# Sign convention: the legacy flux file stores river inflows as negative values.
# River-inflow entries apply a `linear` transform (scale: -1.0) to express them
# in the positive-inflow convention. Export/diversion columns (ccc*, cvp,
# northbay/bks, swp) are already positive and are ingested as-is.

dropbox_home: //cnrastore-bdo/Modeling_Data/repo_processing_scratch/staging   # staging scratch area; the reconcile destination is inferred from repo_name
modeling_data: //cnrastore-bdo/Modeling_Data/
target_tz: "Etc/GMT+8"    # Odd, but the correct one in POSIX/pandas for PST.
target_tz_label: PST


data:
  # -------- from flux_cfs_v20260731.csv (wide, one column per boundary) --------
  - name: coyote_flow
    skip: False
    collect:
      file_pattern: "flux_cfs_v20260731.csv"
      wildcard: none
      location: "${modeling_data}/schism_legacy_bc"
      recursive_search: False
      reader: read_ts
      reader_args:
         force_regular: True
      selector: coyote
      splice_args:
         rename: value
    transforms:
      - name: linear
        args:
          scale: -1.0
    metadata:
      station_id: coyote
      agency_id: usgs
      source: usgs
      agency: usgs
      processor: dms
      subloc: default
      freq: infer
      param: flow
      unit: f^3/s
      time_zone: ${target_tz}
      time_zone_label: ${target_tz_label}
      latitude: registry_lookup
      longitude: registry_lookup
      process_method: Legacy SCHISM boundary flow input (WY2007-2025); see schism_legacy_bc/readme.txt
      process_script: process_flow.py
    output:
      repo_name: processed
      staging:
        dir: ${dropbox_home}
        write_args:
          float_format: "%0.3f"
          chunk_years: False
      # repo_data_dir: ./fake_repo   # Use repo_data_dir only for mock experimentation. The destination is normally inferred from the repo
      reconcile:
        prefer: staged
        allow_new_series: true

