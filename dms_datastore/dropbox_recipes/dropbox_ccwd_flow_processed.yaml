dropbox_home: //cnrastore-bdo/Modeling_Data/repo_processing_scratch/staging   # staging scratch area; the reconcile destination is inferred from repo_name
modeling_data: //cnrastore-bdo/Modeling_Data/
target_tz: "Etc/GMT+8"    # Odd, but the correct one in POSIX/pandas for PST.
target_tz_label: PST


data:
  - name: ccc_rock_flow
    skip: False
    collect:
      file_pattern: "ccc_flow.csv"
      wildcard: time_shard    # time_sharded | time_overlap | data | none.
            # If time_sharded, indicates non-overlapping timestamps that uses year chunking.
            # If time_overlap, indicates wildcards are ordered by date 20250531(lexicographic must = chronological)
            # If data, represents different station/variable. Look for metadata in the file and station lists.
            # If none, a wildcard is an error. # todo: test
      location:   "${modeling_data}/repo_processing_scratch/"  # This could be understood as a default
      recursive_search: False
      reader: read_ts    # Names, pointers to code etc. To be fleshed out
      reader_args:
         names: ["datetime", "value"]
         na_values: ["(null)", "null", "NULL", ""]
         hint: "resort"
         force_regular: True
      merge_method: "ts_splice" # We will not call read_ts on wildcard, but rather glob and read and creat list of dfs
      merge_args:
         transition: prefer_last
      selector: null  # Usually a column name. When read_last_resort_csv is used, use null.
    transforms: #no transforms on daily data needed
    metadata:
      station_id: ccc
      agency_id: ccc
      source: cdec
      agency: ccwd
      processor: dms   # required by the 'processed' repo filename templates
      subloc: default
      freq: infer  # None for irregular, "infer" for infer.
      param: flow
      unit: f^3/s
      time_zone: ${target_tz}
      time_zone_label: ${target_tz_label}
      latitude: registry_lookup
      longitude: registry_lookup
      process_method: simple interpolate of daily data from cdec and convert to 15min data using rhistinterp
      process_script: process_flow.py

    output:
      repo_name: processed   # pointer to an entry in dstore_config.yaml
      staging:
        dir: ${dropbox_home}
        write_args:
          float_format: "%0.0f"
          chunk_years: False
      # repo_data_dir: ./fake_repo   # Use repo_data_dir only for mock experimentation. The destination is normally inferred from the repo
      reconcile:
        prefer: staged
        allow_new_series: false

