# Initialization (backfill) recipe: legacy SCHISM boundary WATER TEMPERATURE.
#
# One-time ingestion of the legacy simulation boundary water-temperature inputs
# in schism_legacy_bc into the `processed` repo. Regular 15-min series.
# Run once with `skip: False`, confirm, then flip each entry to `skip: True`.
#
# Temperature is straightforward: one column per boundary, degrees Celsius, no
# sign convention and no derived columns. The `sac` column maps to the
# Sacramento at K Street (sack). The lumped `east` column is intentionally not
# ingested here.

dropbox_home: //cnrastore-bdo/Modeling_Data/repo_processing_scratch/staging   # staging scratch area; the reconcile destination is inferred from repo_name
modeling_data: //cnrastore-bdo/Modeling_Data/
target_tz: "Etc/GMT+8"    # Odd, but the correct one in POSIX/pandas for PST.
target_tz_label: PST


data:
  - name: coyote_temp
    skip: False
    collect:
      file_pattern: "temp_degc_v20260730.csv"
      wildcard: none
      location: "${modeling_data}/schism_legacy_bc"
      recursive_search: False
      reader: read_ts
      reader_args:
         na_values: ["(null)", "null", "NULL", ""]
         force_regular: True
      selector: coyote
      splice_args:
         rename: value
    transforms:
    metadata:
      station_id: coyote
      processor: dms
      subloc: default
      freq: infer
      param: temp
      unit: deg_c
      time_zone: ${target_tz}
      time_zone_label: ${target_tz_label}
      latitude: registry_lookup
      longitude: registry_lookup
      process_method: Legacy SCHISM boundary water temperature input (WY2007-2025); see schism_legacy_bc/readme.txt
      process_script: process_temp.py
    output:
      repo_name: processed
      staging:
        dir: ${dropbox_home}
        write_args:
          float_format: "%0.2f"
          chunk_years: False
      # repo_data_dir: ./fake_repo   # Use repo_data_dir only for mock experimentation. The destination is normally inferred from the repo
      reconcile:
        prefer: staged
        allow_new_series: true

