

dropbox_home: temp/dropbox   # This is a placeholder. In practice, this would be set to the actual path of the dropbox home directory on the user's system.
modeling_data: //cnrastore-bdo/Modeling_Data/
target_tz: "Etc/GMT+8"    # Odd, but the correct one in POSIX/pandas for PST.
target_tz_label: PST 


data:
  - name: smscg
    skip: False
    collect:
      file_pattern: "MSCK_Data_2024*.csv"
      wildcard: time_overlap    # time_sharded | time_overlap | data | none. 
            # If time_sharded, indicates non-overlapping timestamps that uses year chunking. 
            # If time_overlap, indicates wildcards are ordered by date 20250531(lexicographic must = chronological)
            # If data, represents different station/variable. Look for metadata in the file and station lists. 
            # If none, a wildcard is an error. # todo: test
      location:   "${modeling_data}/hydraulic_structures/incoming"  # This could be understood as a default
      recursive_search: False
      reader: read_ts    # Names, pointers to code etc. To be fleshed out
      reader_args:
         names: ["datetime", "gate_1","gate_2","gate_3","flow","vel","level_down","level_up"]
         #usecols: ["datetime", "gate_1","gate_2","gate_3"]
         na_values: ["(null)", "null", "NULL", ""]
         hint: "resort"
         force_regular: False
      merge_method: "ts_splice" # We will not call read_ts on wildcard, but rather glob and read and creat list of dfs
      merge_args:
         transition: prefer_first
      selector: ["gate_1","gate_2","gate_3"]  # Usually a column name. When read_last_resort_csv is used, use null.
    transforms:
      - name: dst_st      # SCADA is delivered local time. Often this is not needed from better data sources
        args:
          src_tz: US/Pacific
          target_tz: ${target_tz}
      - name: coarsen
        args:
          grid: 2min
          preserve_vals: [0.0]
          qwidth: 0.01
          hyst: 0.5
          heartbeat_freq: 60min    #minimal level of regularity in the data
    metadata: 
      station_id: smscg
      agency_id: smscg
      source: dms
      agency: dwr
      freq: None   # None for irregular, "infer" for infer.
      param: height
      unit: ft
      sublocation: radial
      time_zone: ${target_tz}
      time_zone_label: ${target_tz_label}   
      latitude: 38.09325         # projected will be inferred. User changes should be made to projected, not latitude/longitude. 
      longitude: -121.88641

    output:
      # staging:
      staging_dir: ${dropbox_home}/hydraulic_structures/drop_staging/formatted
      write_args:
        float_format: "%0.3f"
        chunk_years: False
      # repo: 
      repo_dir: temp/fake_repo/formatted
      merge_priority: staged
      allow_new_series: true
      inspection:
        recent_years: 3
        p3: 0.15
        p10: 0.05      