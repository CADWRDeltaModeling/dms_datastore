      selector: null
    transforms:
    metadata:
      station_id: mtyc1
      agency_id: "9413450"
      source: noaa
      agency: noaa
      processor: dms
      subloc: default
      freq: infer
      param: elev
      unit: m
      time_zone: ${target_tz}
      time_zone_label: ${target_tz_label}
      latitude: registry_lookup
      longitude: registry_lookup
      process_method: Gap-filled with NOAA harmonic tide plus subtidal regressed on Point Reyes
      process_script: process_elev_data.py

    output:
      repo_name: processed
      staging:
        dir: ${dropbox_home}
        write_args:
          float_format: "%0.3f"
          chunk_years: True
      reconcile:
        prefer: staged
        allow_new_series: True

