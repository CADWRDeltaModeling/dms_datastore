# Repo-first spot-check configuration
#
# This file intentionally avoids the legacy `groups`/`tiers` proof-of-concept
# model (top-level `repo_dirs`/`staging_dirs`/`tiers`). The active
# implementation is repo-vs-staging checks defined by `locations` and a list
# of named `groups`, each containing `streams`.
#
# `locations` gives the default repo/staging roots; a group may override
# either with its own `repo`/`staging` (a group's `staging` is the tier's
# `spot_target`) when groups live under different physical roots.
#
# Each `groups[].streams[]` entry is one of, or both of:
#   - a per-year coverage check (`years` + `pattern`, matched against both
#     `repo` and `staging` -- a group already fixes one filename convention
#     via `repo_label`, so repo and staging can't disagree): does a file for
#     this pattern covering year Y exist in spot_target (and, if `require`,
#     in `repo` as the baseline)?
#   - an absolute count check (`min_count`/`max_count`, optionally scoped by
#     `count_pattern`; omit `count_pattern` to count every file in
#     spot_target matched by the group's `subset`). This is the safety
#     valve for a collapsed or partial run (e.g. "only 1400 files landed").
#     `partial: true` sources (NOAA predictions is the recurring example)
#     use `partial_min_count`/`partial_max_count` instead; with neither set,
#     the check is skipped (logged, not failed) until real numbers are
#     learned for that source. `warn_only: true` logs an under/over-threshold
#     result at WARNING (and counts it in `warnings`) instead of failing the
#     run -- for a real, known gap that shouldn't block update_repo/
#     update_flagged_data (e.g. one source lagging while others are fine).
#
# A stream may also declare filename-only `integrity` checks (see
# `KNOWN_INTEGRITY_CHECKS` in spot_check.py): `filename_correct`,
# `station_in_registry`, `agency_id_matches_registry`. These are resolved
# against the group's own `repo_label`, naming the dstore_config repo (e.g.
# `raw`, `formatted`, `screened`) whose filename_templates/registry apply --
# a group validates one physical tier, so there is one filename convention
# per group, not per stream. They don't open files, so they run over every
# matched file rather than a sample -- this is where usgs/usbr/ncro
# agency-id regressions get caught (see usgs_to_usbr_transition.md).
# `agency_id_matches_registry` uses a `contains` comparison, not `==`:
# NCRO's registry `agency_id` doesn't always match the filename token
# exactly.
#
# `Subset` narrows the files considered, and `IdentityPolicy` can be used when
# a coverage check should tolerate equivalent naming conventions.
#
# A group may also opt into a "bulk relative" repo-vs-staging count check by
# setting `bulk_relative_pattern` (e.g. "*.csv", matched via the group's
# `subset` against both `repo` and `staging`): are there roughly as many
# matching files in staging as in repo? This is off by default -- a group
# without `bulk_relative_pattern` runs no repo-vs-staging ratio check at all,
# only its declared `streams`. `n_count_fract`/`min_count_abs` at the group
# level override the `defaults` of the same name for that group only; set
# explicitly to e.g. `${defaults.n_count_fract}` to inherit the default
# visibly, or to a different number to tune (or loosen) this group alone.
# This check can flag a large, real shortfall (staging far short of repo)
# that isn't a code bug -- investigate with compare_directories.py before
# assuming the fraction itself is wrong.
#
# All failures across a run are logged (with a final SPOT CHECK SUMMARY line
# giving the counts) before this program exits; nothing here stops early on
# the first failure, so an unsupervised pipeline run still gets a complete
# log to triage. Tuning tip: set a stream's min_count absurdly high (e.g.
# 1000000), rerun, read the logged `found=N`, then set min_count a bit below
# the typical N.

vars:
  continuous_staging_root: "//cnrastore-bdo/Modeling_Data/repo_staging_auto/continuous"
  continuous_repo_root: "//cnrastore-bdo/Modeling_Data/repo/continuous"

locations:
  repo: "${vars.continuous_repo_root}/formatted"
  staging: "${vars.continuous_staging_root}/formatted"

# Default n_count_fract/min_count_abs for any group that opts into the bulk
# relative check via `bulk_relative_pattern` and doesn't override them itself.
# There is no fraction that means much across every data source, so groups
# with source-specific expectations should tune their own `n_count_fract`
# instead of relying solely on this fallback.
defaults:
  n_count_fract: 0.90
  min_count_abs: 10

groups:
  - name: continuous_raw
    # Raw has no separate historical "repo" copy to diff against (its
    # configured dstore_config root already lives under repo_staging_auto),
    # so repo == staging here: a bulk relative check would be a trivial,
    # meaningless pass. Deliberately no `bulk_relative_pattern` -- the real
    # gate for raw is the absolute count check below. Raw filenames also use
    # 20-year blocked shards, so a per-year relative count comparison isn't
    # meaningful either way.
    repo: "${vars.continuous_staging_root}/raw"
    staging: "${vars.continuous_staging_root}/raw"
    repo_label: raw
    ignore_cutoff_year: true   # No cutoff given here, but this ensures it will ignore any cutoff year even on command line
    subset:
      include: ["*.csv"]
    streams:
      - name: raw_total_count
        min_count: 1900
        max_count: 3000
        # TODO: partial thresholds unknown yet -- --partial isn't used much
        # for raw at the moment. Leave partial_min_count/max_count unset.
        integrity: [filename_correct, station_in_registry, agency_id_matches_registry]
      - name: raw_des_count
        count_pattern: "des_*.csv"
        min_count: 400
      - name: raw_ncro_count
        count_pattern: "ncro_*.csv"
        min_count: 650
      - name: raw_noaa_count
        count_pattern: "noaa_*.csv"
        min_count: 7


  - name: continuous_formatted
    repo_label: formatted
    # No bulk_relative_pattern here: a compare_directories.py run (2026-09-24,
    # see formatted_diffs.txt) showed the repo/staging gap is made up of several
    # unrelated, non-uniform causes (stale cdec_dlc_dlc_* holdovers no longer
    # downloaded, usgs stations now attributed to usbr/cdec per
    # usgs_to_usbr_transition.md, noaa predictions that are robocopied rather
    # than downloaded, and a real des shortfall) -- no single fraction means
    # anything here. Gating instead uses the absolute counts below, tuned per
    # source from that same run.
    subset:
      include: ["*.csv"]
      # Reuses compare_excepts_formatted.txt's base=True,compare=False rows
      # (files known to be repo-only) so a stream doesn't need its own copy
      # of the same expected-gap patterns.
      exclude_file: compare_excepts_formatted
    streams:
      - name: usgs_flow_2024
        years: [2024]
        pattern: "usgs_*.csv"
        require: true
        open_file: false
      - name: ncro_ec_history
        years: [2020, 2021, 2022]
        pattern: "ncro_*.csv"
        require: false
      - name: formatted_total_count
        # Observed staging total was 14923 (compare_directories.py, 2026-09-24);
        # 14000 leaves safety margin without masking a real collapse.
        min_count: 14000
        max_count: 25000
        integrity: [filename_correct, station_in_registry, agency_id_matches_registry]
      - name: formatted_usgs_count
        # Observed 2655; many usgs stations are now attributed to usbr/cdec
        # (see usgs_to_usbr_transition.md) so this floor reflects the smaller
        # post-transition population, not the pre-transition usgs count.
        count_pattern: "usgs_*.csv"
        min_count: 2400
      - name: formatted_des_count
        # Observed 2970 against ~3391 in repo (421 des files missing from
        # staging as of 2026-09-24) -- a real, known gap worth tracking but
        # not one that should block update_repo. warn_only logs it without
        # failing; raise/remove min_count once the des grab is fixed.
        count_pattern: "des_*.csv"
        min_count: 3200
        warn_only: true
      - name: freeport_flow_open
        # fpt is an important station, so it gets its own always-on
        # open/freshness/metadata check rather than relying on the bulk
        # count checks above. This is also the practical exercise of the
        # max_age/metadata stream fields (otherwise untested in production).
        pattern: "usgs_fpt_*flow_*.csv"
        open_file: true
        max_age: "24h"
        metadata:
          agency: usgs



  - name: continuous_screened
    repo: "${vars.continuous_repo_root}/screened"
    staging: "${vars.continuous_staging_root}/screened"
    repo_label: screened
    cutoff_year: 2010
    # Explicitly inherits the default fraction (equivalent to omitting this
    # line) -- shown here as the visible-opt-in form the header describes.
    bulk_relative_pattern: "*.csv"
    n_count_fract: ${defaults.n_count_fract}
    subset:
      include: ["*.csv"]
      # Reuses compare_excepts_screened.txt's base=True,compare=False rows
      # (files known to be repo-only) so a stream doesn't need its own copy
      # of the same expected-gap patterns.
      exclude_file: compare_excepts_screened
    streams:
      - name: usgs_flow_2024
        years: [2024]
        pattern: "usgs_*.csv"
        require: true
        open_file: false
      - name: screened_total_count
        # TODO: tune from a logged `found=` reading; placeholder for now.
        min_count: 10
        integrity: [filename_correct, station_in_registry, agency_id_matches_registry]


